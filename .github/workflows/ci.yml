name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_FAYZ_STORE_ID: ${{ vars.PUBLIC_FAYZ_STORE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The route tree is generated by the Start plugin at build time; build
      # first so typecheck sees it.
      - run: npm run build
      - run: npm run typecheck

  # Armed by the CLOUDFLARE_ACCOUNT_ID repository VARIABLE next to the
  # CLOUDFLARE_API_TOKEN SECRET. Until both exist the job is skipped.
  deploy:
    name: Deploy (Cloudflare Workers)
    needs: gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://airfryer-shop.creators-4ad.workers.dev' }}
    env:
      # Vite inlines PUBLIC_* at build time. Publishable values, so variables.
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_FAYZ_STORE_ID: ${{ vars.PUBLIC_FAYZ_STORE_ID }}
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
      - name: Smoke the deployment
        env:
          BASE: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://airfryer-shop.creators-4ad.workers.dev' }}
        run: |
          set -e
          # A fresh Worker's workers.dev hostname answers 404 for a few seconds
          # after the first deploy; give propagation a minute before judging.
          for i in $(seq 1 12); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/")" = 200 ] && break
            sleep 5
          done
          # One set of English URLs; the language lives in a cookie, not the path.
          for p in / /library /partnerships /shirt /product/camisa-viva-los-seres-que-bailan; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p")
            echo "$p -> $code"; [ "$code" = 200 ]
          done
          curl -s -H 'Accept-Language: pt-BR' "$BASE/product/camisa-viva-los-seres-que-bailan" | grep -q 'Adicionar ao carrinho'
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/nope")" = 404 ]
          # Links from the old static site, including printed dossiers.
          for p in /processo/ /salvadiscos/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p")
            echo "$p -> $code"; [ "$code" = 200 ]
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/sessions.html")" = 301 ]
